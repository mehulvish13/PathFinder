# PathFinder backend on Render (free tier, no card required).
# Blueprint: https://render.com/docs/blueprint-spec
# Dashboard steps: New → Blueprint → select repo → set DATABASE_URL
# (Neon PostgreSQL) + GEMINI_API_KEY + CORS_ORIGINS (your Vercel URL) → Apply.
# NOTE: production must use Neon PostgreSQL via DATABASE_URL, not SQLite
# (Render's free filesystem is ephemeral).
services:
  - type: web
    name: pathfinder-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
